    <header>
      <h1>BREW Protocol</h1>
      <p><strong>コーヒー抽出ガイド / Coffee Extraction Guide</strong></p>
      <p>BREW Protocol は、V60・カリタ・クレバードリッパー・エアロプレスを使ったコーヒー抽出のステップバイステップガイドアプリです。豆の量を入力するとレシピが自動スケールされ、内蔵タイマーが各ステップをナビゲートします。</p>
      <p>BREW Protocol is a step-by-step coffee brewing guide for V60, Kalita Wave, Clever Dripper, and Aeropress. Set your bean amount, follow the built-in timer, and brew café-quality coffee at home.</p>
    </header>

    <h2>使い方 / How to Use</h2>
    <ol>
      <li>一覧からレシピを選ぶ — Select a recipe from the list</li>
      <li>豆の量をグラム単位で入力する — Enter your bean amount in grams</li>
      <li>グラインダー設定を確認する — Check the grind size for your grinder</li>
      <li>「抽出画面へ」を押して内蔵タイマーを開始 — Tap "Start" to begin the guided timer</li>
      <li>各ステップの指示に従って注湯・待機 — Follow pour and wait instructions per step</li>
    </ol>

    <h2>対応ブリューワー / Supported Brewers</h2>

    <h3>V60 (ハリオ V60)</h3>
    <p>ハリオ V60 は円錐形のドリッパーで、大きなら旋溝とひとつの大きな穴が特徴です。注湯速度とスパイラルモーションをコントロールすることで、クリーンでブライトなカップを実現します。浅煎りから中煎りの豆に特に向いています。</p>
    <p>The Hario V60 is a conical pour-over dripper with a large single hole and spiral ridges. Precise pouring technique creates a clean, bright cup. Best for light to medium roasts.</p>

    <h3>カリタウェーブ (Kalita Wave)</h3>
    <p>カリタウェーブは平底で3つの小さな穴を持ちます。コーヒーベッド全体に均一にお湯が通るため、安定した抽出が得られます。中煎りからやや深煎りの豆でバランスのとれたカップに仕上がります。</p>
    <p>The Kalita Wave has a flat bottom with three small holes, promoting even extraction across the entire coffee bed. Produces a balanced, consistent cup. Great for medium roasts.</p>

    <h3>クレバードリッパー (Clever Dripper)</h3>
    <p>クレバードリッパーはイマージョン（浸漬）式のドリッパーで、弁を開くまでコーヒーが液体に浸かり続けます。浸漬時間と注湯量を調整することで、フレンチプレスのようなボディとドリップのクリーンさを両立できます。</p>
    <p>The Clever Dripper is an immersion brewer — coffee steeps in water until you open the valve. Combining steep time and pour control delivers a full body with the clarity of a pour-over.</p>

    <h3>エアロプレス (Aeropress)</h3>
    <p>エアロプレスは圧力を使って短時間で抽出する器具です。抽出時間が短く、細かい調整がしやすいため、濃厚なエスプレッソスタイルから滑らかなアメリカーノまで幅広いスタイルに対応できます。</p>
    <p>The Aeropress uses gentle air pressure to brew quickly. Highly versatile — from concentrated espresso-style shots to smooth, mellow cups — with a short brew time and easy cleanup.</p>

    <h2>グラインダー対応 / Supported Grinders</h2>
    <p>各レシピにはコマンダンテ・タイムモア・Zpresso・Varia の4機種向けグラインド目安が記載されています。</p>
    <p>Each recipe includes grind settings for Comandante C40/C60, Timemore C2/C3 Max, Zpresso J-Max/K-Max, and Varia VS3.</p>

    <h2>コーヒー抽出の基礎知識 / Coffee Brewing Basics</h2>

    <h3>湯温 / Water Temperature</h3>
    <p>湯温はコーヒーの抽出に大きな影響を与えます。浅煎りは94〜96°C、中煎りは90〜92°C、深煎りは85〜88°Cが目安です。温度が高いほど抽出が進み、フレーバーが強く出ます。</p>
    <p>Water temperature significantly affects extraction. Light roasts: 94–96°C; medium roasts: 90–92°C; dark roasts: 85–88°C. Higher temperature increases extraction rate.</p>

    <h3>挽き目 / Grind Size</h3>
    <p>挽き目は抽出速度を左右します。細すぎると過抽出で苦みが出やすく、粗すぎると未抽出で酸味や薄さが際立ちます。各レシピの推奨挽き目を参考にしてください。</p>
    <p>Grind size controls extraction rate. Too fine causes over-extraction (bitterness); too coarse causes under-extraction (sourness, thin body). Follow each recipe's recommended grind setting.</p>

    <h3>蒸らし / Blooming</h3>
    <p>蒸らしとは最初に少量のお湯で豆を湿らせ、ガス（CO₂）を放出させることです。新鮮な豆ほどガスが多く、蒸らしをしっかり行うことで後の抽出が均一になります。</p>
    <p>Blooming is the initial pre-infusion where a small amount of water saturates the grounds, allowing CO₂ to escape. Fresh beans bloom vigorously. Proper blooming ensures even extraction in subsequent pours.</p>

    <h3>粉量と水量の比率 / Coffee-to-Water Ratio</h3>
    <p>一般的なコーヒーの粉量と水量の比率は1:15〜1:17が目安です（例：15gの豆に225〜255mlのお湯）。BREW Protocolの各レシピはベースの比率を持ち、豆の量を変更すると水量も自動的にスケールされます。</p>
    <p>A common coffee-to-water ratio is 1:15 to 1:17 (e.g., 15g coffee to 225–255ml water). BREW Protocol recipes have a default ratio — changing your bean amount automatically scales the water volume.</p>
